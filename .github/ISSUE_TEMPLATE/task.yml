name: "Task / Feature"
description: "File a discrete task or feature for parallel execution"
title: "[Lane] Short description of task"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📋 Task Definition
        Fill out this form to ensure clear boundaries across seats.

  - type: dropdown
    id: lane
    attributes:
      label: Lane (Code Path Boundary)
      description: Which area of the codebase does this ticket modify?
      options:
        - interface
        - service
        - data
        - platform
        - docs/framework
        - shared — needs a senior call
    validations:
      required: true

  - type: dropdown
    id: owner
    attributes:
      label: Seniority Level Required
      description: Does this touch core architecture or standard features?
      options:
        - junior
        - senior
        - unsure — needs a senior call
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What needs to be done?
      description: Clear, unambiguous description of the expected behavior.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed File Paths
      description: List the directories or files this task is permitted to touch.
    validations:
      required: true
