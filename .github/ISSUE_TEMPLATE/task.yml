name: "Task / Feature"
description: "File a discrete task or feature for parallel execution"
title: "Short description of task"
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        ### 📋 Task Definition
        Fill out this form to ensure clear boundaries across seats.

        The one field that matters is **Allowed File Paths**. It is the boundary the
        merge gate enforces, and it is what lets this ticket be handed to an agent on
        its own if it comes to that.

  - type: input
    id: lane
    attributes:
      label: Lane (which feature this belongs to)
      description: >-
        A feature, top to bottom — its service, its schema, its API route, its page
        and its tests. Not a technology layer: not "backend", not "frontend", not
        "data". Leave it blank if you are not sure; lanekeeper reads the backlog as a
        whole and proposes the grouping, which is a better guess than a single ticket
        can make.
      placeholder: "checkout"
    validations:
      required: false

  - type: dropdown
    id: owner
    attributes:
      label: Seniority Level Required
      description: Does this touch core architecture or standard features?
      options:
        - junior
        - senior
        - unsure — needs a senior call
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What needs to be done?
      description: Clear, unambiguous description of the expected behavior.
    validations:
      required: true

  - type: textarea
    id: allowed_paths
    attributes:
      label: Allowed File Paths
      description: >-
        The files and directories this task is permitted to touch — **one path or glob
        per line**. Name what this feature actually owns across the whole stack, not
        one side of it. No need to tidy your repository first; a path can point
        anywhere it already is.
      placeholder: |
        src/lanekeeper/intake/**
        tests/test_intake_*.py
        docs/start-step1-intake.md
    validations:
      required: true
