name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-and-docs:
    name: Shell syntax & required files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell script syntax
        run: |
          bash -n bootstrap.sh
          bash -n templates/git-hooks/pre-push
          bash -n templates/git-hooks/pre-commit

      - name: Verify required files exist
        run: |
          for f in README.md CONTRIBUTING.md SECURITY.md LICENSE CHANGELOG.md VERSION \
                   01-working-agreement.md 02-conflict-management.md \
                   03-orchestration.md 04-agent-setup.md; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done

      - name: VERSION must match pyproject
        run: |
          v_file=$(tr -d '[:space:]' < VERSION)
          v_proj=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "VERSION=$v_file pyproject=$v_proj"
          test "$v_file" = "$v_proj" || { echo "VERSION and pyproject.toml disagree"; exit 1; }

  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The full supported range declared in pyproject (requires-python = ">=3.9").
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Cross-platform smoke: the locking layer has separate Windows and POSIX paths.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Configure git identity (required by worktree tests)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile all sources
        run: python -m compileall -q src tests benchmarks

      - name: Run test suite
        run: python -m unittest discover -v tests

  reliability:
    name: Reliability benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      # Exits non-zero on any collision, leak, or undetected lane violation.
      - name: Benchmark (gates on measured results)
        run: python benchmarks/benchmark_parallel.py --cycles 3
