# feature-lanes.yaml — a worked example
#
# A complete lane file for a mid-size e-commerce SaaS: a Python/FastAPI backend,
# a React frontend and a Postgres schema, split into 17 lanes and 8 shared zones.
# The project is invented, but the split is not idle — it is modelled on a real
# 1,360-file product, and every awkwardness it hits is one that showed up there.
#
# Read it for the shape, not the paths. The point it makes is that lanes are
# FEATURE SLICES, not tech layers. There is no "backend" lane, and the
# "storefront" lane is a residue rather than a design — `catalog` owns a service,
# its schemas, its provider, its React page and its tests, because that is the
# set of files one ticket touches. A layer split would have put every one of
# those files in a different lane and made every ticket a four-lane escalation.
#
# Nothing in lanekeeper reads this file. It is documentation: the engine only
# matches globs, and the only lane file that matters is the one you write about
# your own repository.
#
# Judgement calls are marked NOTE. There are more of them than the schema
# suggests there would be.

version: 1

# A path that no lane claims and no shared zone covers.
#   error  — refuse to validate; every file must have a home
#   allow  — anyone may touch it
#   <lane> — it belongs to that lane
# This file names a lane, because the honest answer on a live repo is that the
# greenfield work has an owner too. See the `new-modules` lane.
unowned: new-modules

# Overlapping `allow` globs resolve by specificity: the pattern with the most
# wildcard-free path segments wins, ties broken by pattern length, a remaining
# exact tie is a load error naming both lanes. Declaration order is irrelevant —
# this file is hand-edited and must not depend on it.
#
# A shared zone always beats a lane `allow`, however specific.

defaults:
  harness: claude-code


lanes:

  # ------------------------------------------------------------- the storefront --
  # One lane per customer-facing capability. Each owns its service, its schemas,
  # its provider, its page and its tests — the vertical slice, not the layer.

  catalog:
    description: >-
      Products, variants, inventory counts and product media. The system of
      record for what is for sale.
    owner: senior
    allow:
      - backend/app/domains/catalog/**
      - backend/app/api/products.py
      - backend/app/api/variants.py
      - backend/app/api/inventory.py
      - backend/app/db/products.py
      - backend/app/db/inventory.py
      - backend/app/schemas/product.py
      - backend/app/schemas/variant.py
      - backend/app/schemas/inventory.py
      - backend/app/providers/media_cdn.py
      - frontend/src/components/catalog/**
      - frontend/src/pages/ProductPage.tsx
      - frontend/src/pages/CategoryPage.tsx
      - frontend/src/lib/productMedia*.ts
      - frontend/src/lib/variantSelection*.ts
      - frontend/src/hooks/useProduct.ts
      - backend/tests/test_products*.py
      - backend/tests/test_variants.py
      - backend/tests/test_inventory*.py
    deny:
      # `catalog` renders the product; `pricing-promotions` decides what the
      # number on it says. A carve-out, not a directory boundary — the seam is
      # the feature, not the folder.
      - frontend/src/components/catalog/PriceTag.*
      - frontend/src/components/catalog/DiscountBadge.*

  search:
    description: >-
      Query parsing, the index writer, facets and synonyms. Owns relevance;
      escalates to `catalog` for what is indexed.
    owner: senior
    allow:
      - backend/app/domains/search/**
      - backend/app/api/search.py
      - backend/app/providers/search_opensearch.py
      - backend/app/providers/search_memory.py
      - backend/app/schemas/search.py
      - backend/app/schemas/facets.py
      - frontend/src/components/search/**
      - frontend/src/pages/SearchResultsPage.tsx
      - frontend/src/lib/searchQuery*.ts
      - frontend/src/lib/facetState*.ts
      - frontend/src/hooks/useSearch.ts
      - backend/tests/test_search*.py
      - backend/tests/test_facets.py
      - backend/tests/test_synonyms.py
      - backend/scripts/reindex_catalog.py

  recommendations-cost:
    description: >-
      FUSED. The recommender and what it costs to run. Vector inference is the
      only genuinely expensive call in the product, so the request budget, the
      embedding cache and the per-tenant spend cap move with the model that
      spends them. Separated, the cost lane owns a meter for a thing it cannot
      change.
    owner: senior
    allow:
      - backend/app/domains/recommendations/**
      - backend/app/api/recommendations.py
      - backend/app/providers/embeddings_*.py
      - backend/app/providers/vector_store.py
      - backend/app/infra/inference_budget.py
      - backend/app/infra/embedding_cache.py
      - backend/app/db/inference_ledger.py
      - backend/app/schemas/recommendation.py
      - backend/app/schemas/inference_cost.py
      - frontend/src/components/recommendations/**
      - frontend/src/lib/recommendationSlots*.ts
      - backend/tests/test_recommendations*.py
      - backend/tests/test_inference_budget.py
      - backend/tests/test_embedding_cache.py
      - backend/scripts/rebuild_embeddings.py

  pricing-promotions:
    description: >-
      FUSED. A price and the promotion that modifies it are one artefact. Split
      into two lanes, each was correct about a total the other had already
      changed — a promo lane recalculating a base price it did not own, and a
      pricing lane rounding a discount out of existence.
    owner: senior
    allow:
      - backend/app/domains/pricing/**
      - backend/app/domains/promotions/**
      - backend/app/api/prices.py
      - backend/app/api/promotions.py
      - backend/app/api/coupons.py
      - backend/app/db/price_lists.py
      - backend/app/db/promotions.py
      - backend/app/infra/money.py
      - backend/app/infra/tax_rules.py
      - backend/app/schemas/price.py
      - backend/app/schemas/promotion.py
      - backend/app/schemas/coupon.py
      - frontend/src/components/catalog/PriceTag.*
      - frontend/src/components/catalog/DiscountBadge.*
      - frontend/src/components/pricing/**
      - frontend/src/lib/priceFormat*.ts
      - frontend/src/lib/discountMath*.ts
      - frontend/src/hooks/usePrice.ts
      - backend/tests/test_pricing*.py
      - backend/tests/test_promotions*.py
      - backend/tests/test_coupons.py
      - backend/tests/test_money.py

  cart:
    description: >-
      The basket: line items, quantity rules, merge-on-login, abandoned-cart
      state. Reads prices; never computes them.
    owner: junior
    allow:
      - backend/app/domains/cart/**
      - backend/app/api/cart.py
      - backend/app/db/carts.py
      - backend/app/schemas/cart.py
      - backend/app/schemas/line_item.py
      - frontend/src/components/cart/**
      - frontend/src/pages/CartPage.tsx
      - frontend/src/lib/cartMerge*.ts
      - frontend/src/lib/cartTotals*.ts
      - frontend/src/hooks/useCart.ts
      - backend/tests/test_cart*.py
      - backend/tests/test_line_items.py

  checkout:
    description: >-
      Cart to confirmed order: address capture, shipping selection, the order
      write, idempotency on submit.
    owner: senior
    allow:
      - backend/app/domains/checkout/**
      - backend/app/api/checkout.py
      - backend/app/api/orders.py
      - backend/app/db/orders.py
      - backend/app/infra/idempotency.py
      - backend/app/schemas/order.py
      - backend/app/schemas/address.py
      - backend/app/schemas/checkout_session.py
      - frontend/src/components/checkout/**
      - frontend/src/pages/CheckoutPage.tsx
      - frontend/src/pages/OrderConfirmationPage.tsx
      - frontend/src/lib/addressValidation*.ts
      - frontend/src/lib/checkoutSteps*.ts
      - frontend/src/hooks/useCheckout.ts
      - backend/tests/test_checkout*.py
      - backend/tests/test_orders.py
      - backend/tests/test_idempotency.py

  payments:
    description: >-
      Authorisation, capture, refunds and the gateway webhook. Fails closed;
      never trusts an amount that arrived from a browser.
    owner: senior
    allow:
      - backend/app/domains/payments/**
      - backend/app/api/payments.py
      - backend/app/api/webhooks_payment.py
      - backend/app/providers/payments_*.py
      - backend/app/db/payments.py
      - backend/app/db/refunds.py
      - backend/app/schemas/payment.py
      - backend/app/schemas/refund.py
      - frontend/src/components/payments/**
      - frontend/src/lib/paymentIntent*.ts
      - frontend/src/lib/amountsAreServerOwned.test.ts
      - backend/tests/test_payments*.py
      - backend/tests/test_refunds.py
      - backend/tests/test_payment_webhook*.py

  fulfilment:
    description: >-
      Everything after the money clears: warehouse allocation, carrier labels,
      tracking, and returns back through the same seam.
    owner: senior
    allow:
      - backend/app/domains/fulfilment/**
      - backend/app/domains/returns/**
      - backend/app/api/shipments.py
      - backend/app/api/returns.py
      - backend/app/providers/carrier_*.py
      - backend/app/db/shipments.py
      - backend/app/db/returns.py
      - backend/app/schemas/shipment.py
      - backend/app/schemas/return_request.py
      - frontend/src/components/fulfilment/**
      - frontend/src/pages/OrderTrackingPage.tsx
      - frontend/src/pages/ReturnRequestPage.tsx
      - frontend/src/lib/trackingStatus*.ts
      - backend/tests/test_shipments*.py
      - backend/tests/test_returns*.py
      - backend/tests/test_carrier_*.py

  reviews:
    description: >-
      Customer ratings and written reviews, moderation queue, and the aggregate
      score shown on a product.
    owner: junior
    allow:
      - backend/app/domains/reviews/**
      - backend/app/api/reviews.py
      - backend/app/api/moderation.py
      - backend/app/db/reviews.py
      - backend/app/schemas/review.py
      - backend/app/schemas/moderation.py
      - frontend/src/components/reviews/**
      - frontend/src/lib/ratingAggregate*.ts
      - frontend/src/hooks/useReviews.ts
      - backend/tests/test_reviews*.py
      - backend/tests/test_moderation.py

  notifications:
    description: >-
      Transactional email, SMS and push: templates, the send queue, delivery
      receipts, and the per-customer preference model.
    owner: junior
    allow:
      - backend/app/domains/notifications/**
      - backend/app/api/notification_prefs.py
      - backend/app/providers/email_*.py
      - backend/app/providers/sms_*.py
      - backend/app/providers/push_*.py
      - backend/app/templates/email/**
      - backend/app/db/notification_prefs.py
      - backend/app/schemas/notification.py
      - frontend/src/components/notifications/**
      - frontend/src/pages/NotificationSettingsPage.tsx
      - backend/tests/test_notifications*.py
      - backend/tests/test_email_*.py

  # ------------------------------------------------------------- cross-cutting --

  auth:
    description: >-
      Who may see and spend what: sessions, JWT, tenant membership, row-level
      security, API keys. Fails closed; every finding here is a security finding.
    owner: senior
    allow:
      - backend/app/auth/**
      - backend/app/api/sessions.py
      - backend/app/api/api_keys.py
      - backend/app/db/tenants.py
      - backend/app/db/memberships.py
      - backend/app/db/api_keys.py
      - backend/app/infra/crypto.py
      - backend/app/infra/rate_limit.py
      - backend/app/schemas/session.py
      - backend/app/schemas/tenant.py
      - frontend/src/store/authStore.*
      - frontend/src/store/tenantStore.ts
      - frontend/src/hooks/useAuth.ts
      - frontend/src/pages/LoginPage.tsx
      - frontend/src/pages/OAuthCallbackPage.tsx
      - frontend/src/pages/team/**
      - frontend/src/lib/authClient.ts
      - backend/tests/_rls_policy_scan.py
      - backend/tests/test_auth*.py
      - backend/tests/test_sessions.py
      - backend/tests/test_tenant_isolation*.py
      - backend/tests/test_rls_*.py
      - backend/tests/test_rate_limit.py

  seller-portal:
    description: >-
      The merchant-facing half: listing management, payouts, seller analytics.
      A different audience from the storefront, so a different lane.
    owner: junior
    allow:
      - backend/app/domains/seller/**
      - backend/app/api/seller_*.py
      - backend/app/db/payouts.py
      - backend/app/schemas/seller.py
      - backend/app/schemas/payout.py
      - frontend/src/components/seller/**
      - frontend/src/pages/seller/**
      - frontend/src/lib/payoutSchedule*.ts
      - backend/tests/test_seller_*.py
      - backend/tests/test_payouts.py

  admin-console:
    description: >-
      Internal operations: order lookup, manual refunds, feature flags, the
      support impersonation path.
    owner: junior
    allow:
      - backend/app/domains/admin/**
      - backend/app/api/admin_*.py
      - backend/app/db/feature_flags.py
      - backend/app/db/audit_log.py
      - backend/app/schemas/admin.py
      - backend/app/schemas/audit.py
      - frontend/src/components/admin/**
      - frontend/src/pages/admin/**
      - frontend/src/lib/featureFlags*.ts
      - backend/tests/test_admin_*.py
      - backend/tests/test_audit_log.py
      - backend/tests/test_feature_flags.py

  platform:
    description: >-
      The request seam: middleware, background workers, the job runner, the
      provider registry, tracing. Steward of the shared spine — it is the lane
      other lanes escalate TO.
    owner: senior
    allow:
      - backend/app/api/_shared.py
      - backend/app/api/health.py
      - backend/app/jobs/**
      - backend/app/workers/**
      - backend/app/infra/startup.py
      - backend/app/infra/outbox.py
      - backend/app/infra/retries.py
      - backend/app/providers/queue_*.py
      - backend/app/providers/object_store.py
      - backend/tests/test_jobs*.py
      - backend/tests/test_workers.py
      - backend/tests/test_outbox.py
      - backend/tests/test_registry.py
      - backend/tests/test_health.py
      - backend/scripts/dump_schema.py
      - backend/scripts/export_contracts.py
      - backend/scripts/deploy.py

  storefront:
    description: >-
      Everything the feature lanes do NOT own: the landing page, account pages,
      settings, the shared UI kit, global styles. NOTE this is the one lane named
      for a layer, and it is a residue, not a design — it is the part of the app
      with no feature behind it. It is also usually the lane with the most
      tickets, which is a standing argument for splitting it.
    owner: junior
    allow:
      - frontend/src/components/ui/**
      - frontend/src/components/layout/**
      - frontend/src/components/marketing/**
      - frontend/src/components/common/**
      - frontend/src/pages/HomePage.tsx
      - frontend/src/pages/AccountPage.tsx
      - frontend/src/pages/OrderHistoryPage.tsx
      - frontend/src/pages/SettingsPage.tsx
      - frontend/src/pages/NotFoundPage.tsx
      - frontend/src/index.css
      - frontend/public/**
      - backend/tests/test_static_pages.py

  market-research:
    description: >-
      Work that produces a decision, a benchmark or a spike — not a diff. Vendor
      bake-offs, a pricing experiment's read-out, the build-versus-buy call on
      search. Deliberately has no source paths.
    owner: senior
    allow:
      - docs/decisions/**
      - docs/benchmarks/**
      - docs/strategy-backlog.md
      - benchmarks/**
    # NOTE: a lane with no code is still a lane. It holds a seat, takes tickets
    # and blocks other lanes until it answers. `check` should pass a PR that
    # changes only prose, and refuse one that quietly ships the implementation
    # the spike was supposed to be deciding about.

  new-modules:
    description: >-
      The greenfield lane. Whole subsystems that do not exist yet — the loyalty
      programme, the subscription billing path, the B2B quote flow. Holds every
      path no other lane claims.
    owner: senior
    claims: unowned
    # NOTE: this is the lane a glob-only schema cannot express. Path patterns name
    # files that exist; the work here is defined by what is ABSENT. Without
    # `claims: unowned`, every new module is either a coverage warning or an
    # invented escalation. On the project this file is modelled on, roughly a
    # quarter of the open backlog was in this state at any one time.


# --------------------------------------------------------------------- shared --
# Nobody may take a shared zone as their lane. A `steward` is the lane that may
# edit it without escalation and to whom every other lane escalates — because
# "nobody owns it" is not survivable on a file that sixteen lanes must touch.

shared:

  request-spine:
    description: >-
      Where every feature plugs in. A lane registering its router or its provider
      here is the single most common escalation in the project.
    steward: platform
    mode: escalate
    paths:
      - backend/app/main.py
      - backend/app/config/settings.py
      - backend/app/config/loader.py
      - backend/app/config/limits.py
      - backend/app/config/platform.yaml
      - backend/app/db/session.py
      - backend/app/db/base.py
      - backend/app/providers/registry.py
      - backend/app/providers/base.py
      - backend/app/domains/errors.py
      - backend/app/infra/logging.py
      - backend/app/infra/tracing.py
      - backend/app/middleware/**
      - backend/tests/conftest.py
      - backend/tests/test_config*.py
      # The package roots. A new feature's own __init__.py is covered by its
      # lane's directory glob; these are not, and fall to nobody unless named.
      - backend/app/__init__.py
      - backend/app/api/__init__.py
      - backend/app/db/__init__.py
      - backend/app/domains/__init__.py
      - backend/app/infra/__init__.py
      - backend/app/providers/__init__.py
      - backend/app/schemas/__init__.py
      - backend/tests/__init__.py

  api-contract:
    description: >-
      The typed boundary. Changing an enum or a response envelope breaks every
      lane at once, so it changes by escalation and in one commit.
    steward: platform
    mode: escalate
    paths:
      - backend/app/schemas/_base.py
      - backend/app/schemas/envelope.py
      - backend/app/schemas/enums.py
      - backend/app/schemas/pagination.py
      - backend/app/schemas/money_types.py
      - docs/contracts/**
      - backend/tests/test_schemas.py
      - backend/tests/test_contract_export_is_current.py

  frontend-shell:
    description: >-
      Routing and the app frame. Every feature lane adds a route; none of them
      may reorder someone else's.
    steward: storefront
    mode: escalate
    paths:
      - frontend/src/App.tsx
      - frontend/src/main.tsx
      - frontend/src/routes.tsx
      - frontend/src/types/**
      - frontend/src/lib/apiClient.*
      - frontend/src/lib/constants.ts
      - frontend/src/lib/utils.*
      - frontend/src/lib/storageKey.*
      - frontend/src/hooks/useUnsavedEdits.*
      - frontend/src/test-setup.ts

  order-state:
    description: >-
      The client-side order and cart record — the typed field-to-column map every
      checkout step writes through. NOTE the zone is file-precise, not
      `frontend/src/store/**`, because `auth` legitimately owns two stores in the
      same directory. A shared zone that swallows a whole folder makes its
      neighbour escalate for its own files.
    steward: storefront
    mode: escalate
    paths:
      - frontend/src/store/orderStore.*
      - frontend/src/store/orderColumns.*
      - frontend/src/store/cartStore.ts
      - frontend/src/store/cartColumns.*
      - frontend/src/store/updateOrderBoundary.test.ts

  migrations:
    description: >-
      Ten of the seventeen lanes ship SQL. Filenames are timestamped, so new files
      never collide — but editing an applied migration corrupts every checkout.
      Adding a file is free; touching an existing one is an escalation.
    mode: append_only
    paths:
      - db/migrations/**
      - backend/scripts/migrations/**

  feature-docs:
    description: One file per feature, written by whichever lane built it.
    mode: append_only
    paths:
      - docs/features/**

  build-and-ci:
    description: Dependencies, lint config, CI, secrets policy, the dev bootstrap.
    steward: platform
    mode: escalate
    paths:
      - Makefile
      - package.json
      - scripts/ci.sh
      - .github/**
      - .pre-commit-config.yaml
      - .githooks/**
      - .gitleaks.toml
      - .env.example
      - .gitignore
      - docker-compose.yml
      - backend/pyproject.toml
      - backend/requirements*.txt
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/tsconfig*.json
      - frontend/vite.config.ts
      - frontend/vitest.config.ts
      - frontend/tailwind.config.js
      - frontend/index.html

  project-spine:
    description: >-
      The documents that describe the product to every agent. If you keep one
      entry-point file per harness, they are byte-identical by intent and drift
      the moment one lane edits one of them. No steward — this zone really is
      everybody's.
    mode: escalate
    paths:
      - README.md
      - CLAUDE.md
      - AGENTS.md
      - CONTRIBUTING.md
      - SECURITY.md
      - CHANGELOG.md
      - docs/architecture.md
      - docs/working-agreement.md
