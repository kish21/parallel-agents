# feature-lanes.yaml — a worked example
#
# A lane file written by hand for a real production codebase: ~1,360 tracked
# files, a Python backend, a React frontend and a Postgres schema, split into 17
# lanes and 8 shared zones. The product is a multi-stage AI video generator, and
# its stages (discovery, script, images, video, assembly, QC) are what the lanes
# are named for. Substitute your own.
#
# Read it for the shape, not the paths. The point it makes is that lanes are
# FEATURE SLICES, not tech layers. There is no "backend" lane, and the "frontend"
# lane is a residue rather than a design — `images` owns a stage runner, its
# prompt YAML, its provider, its schemas, its React page and its tests, because
# that is the set of files one ticket touches. A layer split would have put every
# one of those files in a different lane and made every ticket a four-lane
# escalation.
#
# Judgement calls are marked NOTE. There are more of them than the schema
# suggests there would be.

version: 1

# A path that no lane claims and no shared zone covers.
#   error  — refuse to validate; every file must have a home
#   allow  — anyone may touch it
#   <lane> — it belongs to that lane
# This file names a lane, because the honest answer on a live repo is that the
# greenfield work has an owner too. See the `new-files` lane.
unowned: new-files

# Overlapping `allow` globs resolve by specificity: the pattern with the most
# wildcard-free path segments wins, ties broken by pattern length, a remaining
# exact tie is a load error naming both lanes. Declaration order is irrelevant —
# this file is hand-edited and must not depend on it.
#
# A shared zone always beats a lane `allow`, however specific.

defaults:
  harness: claude-code


lanes:

