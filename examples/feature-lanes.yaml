# ------------------------------------------------------------------- shared --
# Nobody may take a shared zone as their lane. A `steward` is the lane that may
# edit it without escalation and to whom every other lane escalates — because
# "nobody owns it" is not survivable on a file that sixteen lanes must touch.

shared:

  pipeline-spine:
    description: >-
      Where every stage plugs in. A stage lane registering itself here is the
      single most common escalation in the project.
    steward: orchestration
    mode: escalate
    paths:
      - backend/app/main.py
      - backend/app/pipeline/conductor.py
      - backend/app/config/platform.yaml
      - backend/app/config/product.yaml
      - backend/app/config/loader.py
      - backend/app/config/limits.py
      - backend/app/db/projects.py
      - backend/app/db/client.py
      - backend/app/providers/registry.py
      - backend/app/providers/base.py
      - backend/app/providers/__init__.py
      - backend/app/domain/errors.py
      - backend/app/infra/logging.py
      - backend/app/infra/tracing.py
      - backend/app/health.py
      - backend/app/validators/**
      - backend/app/prompts/loader.py
      - backend/app/providers/storage_supabase.py
      - backend/app/providers/README.md
      - backend/app/infra/hf_auth.py
      # The package roots. A new stage's own __init__.py is covered by its lane's
      # directory glob; these six are not, and fall to nobody without naming them.
      - backend/app/__init__.py
      - backend/app/api/__init__.py
      - backend/app/config/__init__.py
      - backend/app/db/__init__.py
      - backend/app/domain/__init__.py
      - backend/app/infra/__init__.py
      - backend/app/pipeline/__init__.py
      - backend/app/schemas/__init__.py
      - backend/app/stages/__init__.py
      - backend/tests/__init__.py
      - backend/tests/conftest.py
      - backend/tests/test_config*.py

  api-contract:
    description: >-
      The typed boundary. Changing an enum or an envelope shape breaks every lane
      at once, so it changes by escalation and in one commit.
    steward: orchestration
    mode: escalate
    paths:
      - backend/app/schemas/_base.py
      - backend/app/schemas/api.py
      - backend/app/schemas/enums.py
      - backend/app/schemas/jobs.py
      - backend/app/schemas/stage_state.py
      - backend/app/schemas/distribution.py
      - docs/contracts/**
      - backend/tests/test_schemas.py
      - backend/tests/test_contract_export_is_current.py
      - backend/tests/test_build_record_index_is_current.py

  frontend-shell:
    description: >-
      Routing and the app frame. Every stage lane adds a route; none of them may
      reorder someone else's.
    steward: frontend
    mode: escalate
    paths:
      - frontend/src/App.tsx
      - frontend/src/main.tsx
      - frontend/src/types/**
      - frontend/src/components/pipeline/PipelineStepper.tsx
      - frontend/src/hooks/usePipelineNav.ts
      - frontend/src/hooks/usePipelineCompletedStages.*
      - frontend/src/hooks/useAutoAdvance.ts
      - frontend/src/hooks/useUnsavedEdits.*
      - frontend/src/lib/backendApi.*
      - frontend/src/lib/constants.ts
      - frontend/src/lib/utils.*
      - frontend/src/lib/storageKey.*
      - frontend/src/lib/apiWiring.test.ts
      - frontend/src/lib/endpointUrlWiring.test.ts
      - frontend/src/test-setup.ts

  project-state:
    description: >-
      The client-side project record — the typed field-to-column map every stage
      page writes through. NOTE the zone is file-precise, not
      `frontend/src/store/**`, because `auth` legitimately owns three stores in
      the same directory. A shared zone that swallows a whole folder makes its
      neighbour escalate for its own files.
    steward: frontend
    mode: escalate
    paths:
      - frontend/src/store/projectStore.*
      - frontend/src/store/projectColumns.*
      - frontend/src/store/projectRoundTrip.test.ts
      - frontend/src/store/campaignStore.ts
      - frontend/src/store/campaignColumns.*
      - frontend/src/store/sceneWriteMerge.test.ts
      - frontend/src/store/updateProjectBoundary.test.ts

  migrations:
    description: >-
      Ten of the seventeen lanes ship SQL. Filenames are timestamped, so new files
      never collide — but editing an applied migration corrupts every checkout.
      Adding a file is free; touching an existing one is an escalation.
    mode: append_only
    paths:
      - supabase/migrations/**
      - backend/scripts/migrations/**

  feature-docs:
    description: One file per feature, written by whichever lane built it.
    mode: append_only
    paths:
      - docs/features/**

  build-and-ci:
    description: Dependencies, lint config, CI, secrets policy, the dev bootstrap.
    steward: orchestration
    mode: escalate
    paths:
      - Makefile
      - package.json
      - scripts/ci.sh
      - .github/**
      - .pre-commit-config.yaml
      - .githooks/**
      - .gitleaks.toml
      - .env.example
      - .gitattributes
      - .gitignore
      - backend/pyproject.toml
      - backend/requirements*.txt
      - backend/scripts/dev_server.py
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/tsconfig*.json
      - frontend/vite.config.ts
      - frontend/vitest.config.ts
      - frontend/tailwind.config.js
      - frontend/postcss.config.js
      - frontend/index.html
      - frontend/.npmrc
      - frontend/.nvmrc
      - frontend/src/vite-env.d.ts
      - supabase/config.toml
      - supabase/.gitignore
      - write_migration.js

  project-spine:
    description: >-
      The documents that describe the product to every agent. Three of them are
      byte-identical entry points for three harnesses; they drift the moment one
      lane edits one of them.
    mode: escalate
    paths:
      - CLAUDE.md
      - AGENTS.md
      - GEMINI.md
      - PRODUCT.md
      - STRUCTURE.md
      - DESIGN.md
      - README.md
      - CHANGELOG.md
      - SECURITY.md
      - CONTRIBUTING.md
      - docs/WORKING-AGREEMENT.md
      - docs/sdlc/**
      - docs/playbook/**
      # The harness entry points. Every harness reads its own file and they are
      # meant to say the same thing; one lane editing one is how they diverge.
      - .claude/**
      - .agents/**
