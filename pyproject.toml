[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lanekeeper"
version = "0.5.0"
description = "Mechanical Safety & Coordination Tool for Running Parallel AI Coding Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lanekeeper Contributors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/kish21/parallel-agents"
Repository = "https://github.com/kish21/parallel-agents"
Changelog = "https://github.com/kish21/parallel-agents/blob/main/CHANGELOG.md"

[project.scripts]
# `lanekeeper` is the primary command. `parallel-agents` is kept as an alias so existing
# scripts, docs and muscle memory continue to work; both dispatch to the same entry point.
lanekeeper = "parallel_agents.cli:main"
parallel-agents = "parallel_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
