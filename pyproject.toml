[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-agents"
version = "0.3.0"
description = "Mechanical Safety & Coordination Tool for Running Parallel AI Coding Agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parallel Agents Contributors" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
parallel-agents = "parallel_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
